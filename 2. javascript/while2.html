<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Ověření věku</title>
</head>
<body>
    <script>
        
        let age;
        age = Number(prompt("Zadejte svůj věk:"));
        while (age > 0 || age < 120 ) {
            age = Number(prompt("Zadejte svůj věk:"));
            
        } 
        alert("Váš věk je: " + age + " let.");
    </script>
</body>
</html>
